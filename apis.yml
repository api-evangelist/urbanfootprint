aid: urbanfootprint
name: UrbanFootprint
description: 'UrbanFootprint is a resilient decision intelligence platform that
  delivers urban, climate, and community-resilience data and analytics, helping
  governments, utilities, financial institutions, and planners assess risk and
  make data-driven decisions. Its platform spans scenario analysis (Analyst),
  map-based data exploration (Explorer), and curated data subscriptions covering
  climate hazards, the built environment, and social vulnerability. UrbanFootprint
  is a closed SaaS platform sold via sales contact and publishes no public
  developer API; its application authenticates through Auth0 and consumes an
  internal platform API.'
